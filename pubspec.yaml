name: firabonda
description: "Offline-first tracker for a small men's clothing shop."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  drift: ^2.35.3
  sqlite3_flutter_libs: ^0.6.0+eol
  fl_chart: ^1.3.0
  intl: ^0.20.2
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  csv: ^8.0.0
  share_plus: ^13.3.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
